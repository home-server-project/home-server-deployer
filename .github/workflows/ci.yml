name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Download modules
        run: go mod download
      - name: Normalize formatting for checks
        run: gofmt -w $(find cmd internal -name '*.go' -type f)
      - name: Vet
        run: go vet ./...
      - name: Unit and contract tests
        run: go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build binaries
        run: go build ./cmd/deployer-agent ./cmd/deployer-web

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [agent, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile.${{ matrix.component }}
          push: false
          tags: home-server-deployer-${{ matrix.component }}:ci
          provenance: false
